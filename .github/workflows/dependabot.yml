name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Dependabot auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge when every other check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            json=$(gh pr checks "$PR" --repo "$REPO" --json name,state,bucket)
            failed=$(echo "$json" | jq '[.[] | select(.name != "Dependabot auto-merge" and (.bucket == "fail" or .bucket == "cancel"))] | length')
            pending=$(echo "$json" | jq '[.[] | select(.name != "Dependabot auto-merge" and (.bucket == "pending" or .state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS"))] | length')
            total=$(echo "$json" | jq '[.[] | select(.name != "Dependabot auto-merge")] | length')
            if [ "$failed" -gt 0 ]; then
              echo "A check failed"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for checks"
          exit 1
