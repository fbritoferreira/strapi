name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # "Version Packages" commits are pushed by this workflow; do not run on them.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check for pending changesets
        id: changesets
        # Only .md files other than README.md are changesets. `changeset version`
        # exits 1 when there are none (changesets v3), so gate on this first.
        run: |
          pending=false
          for f in .changeset/*.md; do
            [[ -e "$f" && "$(basename "$f")" != "README.md" ]] && pending=true
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Version and changelog
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm changeset version

      - name: Commit and push version changes
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          NEW_VERSION=$(jq -r .version package.json)

          git add -A
          git commit -m "Version Packages (v${NEW_VERSION}) [skip ci]"
          git push origin main

      - name: Build package
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm build

      - name: Publish to npm (OIDC / Trusted Publishing)
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm publish --access public --no-git-checks

      - name: Extract version for release
        if: steps.changesets.outputs.pending == 'true'
        id: extract-version
        run: |
          NEW_VERSION=$(jq -r .version package.json)
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          # Changelog section for this version: from its heading to the next "## " heading.
          CHANGELOG_SECTION=$(awk -v v="## ${NEW_VERSION}" '
            $0 == v { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md)
          {
            echo "changelog<<EOF"
            echo "${CHANGELOG_SECTION:-No detailed changes available.}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.changesets.outputs.pending == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract-version.outputs.tag }}
          name: Release ${{ steps.extract-version.outputs.tag }}
          target_commitish: main
          body: |
            ## Changes

            ${{ steps.extract-version.outputs.changelog }}

            ## Full Changelog

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            Auto-generated by [Changesets](https://github.com/changesets/changesets).
