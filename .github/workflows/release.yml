name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-publish; queue the next push behind it.
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # "Version Packages" commits are pushed by this workflow; do not run on them.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Admin PAT: GITHUB_TOKEN can't bypass main's required status checks
          # when pushing the "Version Packages" commit.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check for pending changesets
        id: changesets
        # Only .md files other than README.md are changesets. `changeset version`
        # exits 1 when there are none (changesets v3), so gate on this first.
        run: |
          pending=false
          for f in .changeset/*.md; do
            [[ -e "$f" && "$(basename "$f")" != "README.md" ]] && pending=true
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Version and changelog
        if: steps.changesets.outputs.pending == 'true'
        # Changesets bumps every affected package.json; mirror each new version
        # into the package's jsr.json so npm and JSR never drift.
        run: |
          pnpm changeset version
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            NEW_VERSION=$(jq -r .version "$pkg_dir/package.json")
            jq --tab --arg v "$NEW_VERSION" '.version = $v' "$jsr_file" > "$jsr_file.tmp"
            mv "$jsr_file.tmp" "$jsr_file"
            echo "Synced $jsr_file to $NEW_VERSION"
          done

      - name: Commit and push version changes
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A
          git commit -m "Version Packages [skip ci]"
          git push origin main

      # A package is released when its package.json version is not on npm yet.
      # That is exactly the set `changeset version` just bumped, and it also
      # back-fills a version whose publish failed on an earlier run.
      - name: Find packages to release
        id: release
        run: |
          dirs=""
          for pkg in packages/*/package.json; do
            [[ "$(jq -r '.private // false' "$pkg")" == "true" ]] && continue
            NAME=$(jq -r .name "$pkg")
            VERSION=$(jq -r .version "$pkg")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${NAME}/${VERSION}")
            case "$STATUS" in
              200) ;;
              404) dirs="$dirs $(dirname "$pkg")"; echo "Will release $NAME@$VERSION" ;;
              *) echo "Unexpected HTTP $STATUS from npm for $NAME@$VERSION"; exit 1 ;;
            esac
          done
          echo "dirs=${dirs# }" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.release.outputs.dirs != ''
        run: pnpm build

      - name: Publish to npm (OIDC / Trusted Publishing)
        if: steps.release.outputs.dirs != ''
        env:
          DIRS: ${{ steps.release.outputs.dirs }}
        run: |
          for dir in $DIRS; do
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done

      # One tag and GitHub release per published package, with that version's
      # section of the package's CHANGELOG.md as the body.
      - name: Create GitHub releases
        if: steps.release.outputs.dirs != ''
        env:
          DIRS: ${{ steps.release.outputs.dirs }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dir in $DIRS; do
            NAME=$(jq -r .name "$dir/package.json")
            VERSION=$(jq -r .version "$dir/package.json")
            TAG="${NAME}@${VERSION}"
            awk -v v="## $VERSION" '$0 == v {f=1; next} f && /^## / {exit} f' "$dir/CHANGELOG.md" > notes.md
            echo "" >> notes.md
            echo "Full changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/${dir}/CHANGELOG.md" >> notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$(git rev-parse HEAD)"
          done

      # JSR runs after npm and the GitHub release so a JSR failure never blocks
      # them. It is not gated on pending changesets: it publishes whenever a
      # package's jsr.json version is not on JSR yet, so a version that already
      # went to npm can be back-filled by pushing to main.
      - name: Publish to JSR (all unpublished packages)
        run: |
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            NAME=$(jq -r .name "$jsr_file")
            VERSION=$(jq -r .version "$jsr_file")
            SCOPE=${NAME%%/*}
            SCOPE=${SCOPE#@}
            PACKAGE=${NAME##*/}
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.jsr.io/scopes/${SCOPE}/packages/${PACKAGE}/versions/${VERSION}")
            case "$STATUS" in
              200) echo "$NAME@$VERSION already on JSR, skipping" ;;
              404)
                echo "::group::Publishing $NAME@$VERSION to JSR"
                (cd "$pkg_dir" && pnpm jsr publish)
                echo "::endgroup::"
                ;;
              *) echo "Unexpected HTTP $STATUS from JSR API for $NAME"; exit 1 ;;
            esac
          done
