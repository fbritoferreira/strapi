name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # "Version Packages" commits are pushed by this workflow; do not run on them.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Admin PAT: GITHUB_TOKEN can't bypass main's required status checks
          # when pushing the "Version Packages" commit.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          # Enables OIDC trusted publishing with id-token: write permission
          always-auth: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check for pending changesets
        id: changesets
        run: |
          pending=false
          for f in .changeset/*.md; do
            [[ -e "$f" && "$(basename "$f")" != "README.md" ]] && pending=true
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Version and changelog
        if: steps.changesets.outputs.pending == 'true'
        # Changesets bumps every affected package.json; mirror each new version
        # into the package's jsr.json so npm and JSR never drift.
        run: |
          pnpm changeset version
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            NEW_VERSION=$(jq -r .version "$pkg_dir/package.json")
            jq --tab --arg v "$NEW_VERSION" '.version = $v' "$jsr_file" > "$jsr_file.tmp"
            mv "$jsr_file.tmp" "$jsr_file"
            echo "Synced $jsr_file to $NEW_VERSION"
          done

      - name: Commit and push version changes
        if: steps.changesets.outputs.pending == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -A
          git commit -m "Version Packages [skip ci]"
          git push origin main

      - name: Build packages
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm build

      # Publish every non-private workspace package to npm using OIDC trusted publishing.
      - name: Publish to npm (OIDC / Trusted Publishing)
        if: steps.changesets.outputs.pending == 'true'
        run: pnpm publish --access public --no-git-checks --recursive --filter '!./'

      - name: Extract versions for release notes
        if: steps.changesets.outputs.pending == 'true'
        id: extract-version
        run: |
          TAGS=""
          RELEASE_NOTES="## Changes"$'\n\n'
          for pkg in packages/*/package.json; do
            pkg_dir=$(dirname "$pkg")
            NAME=$(jq -r .name "$pkg")
            PRIVATE=$(jq -r '.private // false' "$pkg")
            [[ "$PRIVATE" == "true" ]] && continue
            VERSION=$(jq -r .version "$pkg")
            TAGS="${TAGS}${NAME}@${VERSION} "
            RELEASE_NOTES="${RELEASE_NOTES}- ${NAME} v${VERSION}"$'\n'
          done
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<EOF"
            echo "$RELEASE_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.changesets.outputs.pending == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          target_commitish: main
          body: |
            ${{ steps.extract-version.outputs.notes }}

            ## Packages

            ${{ steps.extract-version.outputs.tags }}

            ## Full Changelog

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            Auto-generated by [Changesets](https://github.com/changesets/changesets).

      # JSR runs after npm and the GitHub release so a JSR failure never blocks
      # them. It is not gated on pending changesets: it publishes whenever a
      # package's jsr.json version is not on JSR yet, so a version that already
      # went to npm can be back-filled by pushing to main.
      - name: Publish to JSR (all unpublished packages)
        if: steps.changesets.outputs.pending == 'true'
        run: |
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            NAME=$(jq -r .name "$jsr_file")
            VERSION=$(jq -r .version "$jsr_file")
            SCOPE=${NAME%%/*}
            SCOPE=${SCOPE#@}
            PACKAGE=${NAME##*/}
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.jsr.io/scopes/${SCOPE}/packages/${PACKAGE}/versions/${VERSION}")
            case "$STATUS" in
              200) echo "$NAME@$VERSION already on JSR, skipping" ;;
              404)
                echo "::group::Publishing $NAME@$VERSION to JSR"
                (cd "$pkg_dir" && pnpm jsr publish)
                echo "::endgroup::"
                ;;
              *) echo "Unexpected HTTP $STATUS from JSR API for $NAME"; exit 1 ;;
            esac
          done