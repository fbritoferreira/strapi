name: PR Testing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest needs ^22.12 || ^24 || >=26, so these are the versions the
        # suite can run on: the active LTS lines plus current. Node 20 is
        # covered by the smoke job below, where Vitest cannot run at all.
        node: [22, 24, 26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Check the published packages
        if: matrix.node == 24
        run: pnpm package:check

      # Every publishable package has a jsr.json next to its package.json;
      # verify they stay in sync. Discovers packages dynamically so adding a
      # new one needs no workflow change.
      - name: Check jsr.json versions match package.json versions
        run: |
          failed=false
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            pkg_version=$(jq -r .version "$pkg_dir/package.json")
            jsr_version=$(jq -r .version "$jsr_file")
            pkg_name=$(jq -r .name "$pkg_dir/package.json")
            if [[ "$pkg_version" != "$jsr_version" ]]; then
              echo "::error::${pkg_name}: jsr.json version ($jsr_version) != package.json version ($pkg_version)"
              failed=true
            fi
          done
          $failed && exit 1 || true

      # Dry-run JSR publish for every package that ships to JSR.
      - name: JSR publish dry run (all packages)
        run: |
          for jsr_file in packages/*/jsr.json; do
            pkg_dir=$(dirname "$jsr_file")
            echo "::group::JSR dry run: $pkg_dir"
            (cd "$pkg_dir" && pnpm jsr publish --dry-run)
            echo "::endgroup::"
          done

      - name: Report coverage to PR
        if: always() && matrix.node == 24
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: "Test Coverage Report"
          json-summary-path: packages/client/coverage/coverage-summary.json
          json-final-path: packages/client/coverage/coverage-final.json
          vite-config-path: packages/client/vitest.config.mts

  smoke:
    name: Built package on the oldest supported Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # The toolchain needs a newer Node than the library does: vitest will not
      # run on 20 at all. So build here...
      - name: Setup Node.js for the build
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ...and exercise what ships on the oldest Node the packages claim.
      # Every package with a scripts/smoke.mjs gets exercised.
      - name: Setup oldest supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Smoke test built packages
        run: |
          for smoke in packages/*/scripts/smoke.mjs; do
            pkg_dir=$(dirname "$(dirname "$smoke")")
            echo "::group::Smoke test: $pkg_dir"
            (cd "$pkg_dir" && node scripts/smoke.mjs)
            echo "::endgroup::"
          done
