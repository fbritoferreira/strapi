name: PR Testing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest needs ^22.12 || ^24 || >=26, so these are the versions the
        # suite can run on: the active LTS lines plus current. Node 20 is
        # covered by the smoke job below, where Vitest cannot run at all.
        node: [22, 24, 26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Check jsr.json version matches package.json
        run: |
          pkg_version=$(jq -r .version package.json)
          jsr_version=$(jq -r .version jsr.json)
          if [[ "$pkg_version" != "$jsr_version" ]]; then
            echo "jsr.json version ($jsr_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: JSR publish dry run
        run: pnpm jsr publish --dry-run

      - name: Report coverage to PR
        if: always() && matrix.node == 24
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage-final.json
          skip-if-no-coverage: false
          title: "Test Coverage Report"
          hide-badge: false
          hide-report: false
          report-only-changed-files: true

  smoke:
    name: Built package on the oldest supported Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      # The toolchain needs a newer Node than the library does: vitest will not
      # run on 20 at all. So build here...
      - name: Setup Node.js for the build
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # ...and exercise what ships on the oldest Node the package claims.
      - name: Setup oldest supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Smoke test the built package
        run: node scripts/smoke.mjs
