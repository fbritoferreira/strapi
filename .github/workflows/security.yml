name: Security

on:
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: security-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  socket:
    name: Socket
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Require Socket API key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -z "$SOCKET_SECURITY_API_KEY" ]; then
            echo "Add the SOCKET_SECURITY_API_KEY repository secret. Create it at https://docs.socket.dev/docs/create-socket-api-key-for-cicd"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Socket CLI
        run: pip install socketsecurity --upgrade

      - name: Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr=${{ github.event.pull_request.number }}
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            pr=${{ github.event.issue.number }}
          fi
          socketcli --target-path "$GITHUB_WORKSPACE" --scm github --pr-number "$pr"

  snyk:
    name: Snyk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require Snyk token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "Add the SNYK_TOKEN repository secret from https://app.snyk.io/account"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Test dependencies
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=pnpm-lock.yaml
