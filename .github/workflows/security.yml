name: Security

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test dependencies
        uses: snyk/actions/node@v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # High threshold: the admin-api plugin's dev tree transitively includes
          # @strapi/strapi peer deps (1300+ packages) whose known medium-severity
          # issues are not exploitable in a published library context.
          args: --all-projects --severity-threshold=high
