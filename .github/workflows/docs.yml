name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_OUTPUT_DIR: docs/.vitepress/dist

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with VitePress
        run: pnpm docs:build

      # Production deployment: upload for GitHub Pages deploy
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_OUTPUT_DIR }}

      # PR preview: upload as a regular artifact so the preview job can deploy it
      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: docs-preview
          path: ${{ env.BUILD_OUTPUT_DIR }}

  deploy-production:
    name: Deploy production docs
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-pr-preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The preview action pushes to gh-pages via git, so the repo must exist.
      - name: Checkout
        uses: actions/checkout@v7

      # Download the built docs from the build job
      - name: Download preview artifact
        uses: actions/download-artifact@v6
        with:
          name: docs-preview
          path: ${{ env.BUILD_OUTPUT_DIR }}

      # Deploy to gh-pages under pr-{number}/ and comment on the PR.
      # Preview URL: https://fbritoferreira.github.io/strapi/pr-{number}/
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ${{ env.BUILD_OUTPUT_DIR }}
          preview-branch: gh-pages
          umbrella-dir: pr-${{ github.event.pull_request.number }}
          action: auto
